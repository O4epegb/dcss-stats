name: 'dcss-api'

services:
  monster_catalog:
    container_name: monster_catalog
    restart: no
    profiles:
      - monsters
    build:
      context: ../../
      dockerfile: ./apps/extractor/Dockerfile
    volumes:
      - monster-catalog-storage:/catalog

  postgres:
    container_name: postgres18
    restart: no
    image: postgres:18
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Run Compose through yarn compose}:5432'
    volumes:
      - postgres18-local-volume:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - 'postgres'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'max_wal_size=8GB'
      - '-c'
      - 'min_wal_size=2GB'
      - '-c'
      - 'temp_file_limit=20GB'
      - '-c'
      - 'wal_buffers=16MB'
      - '-c'
      - 'effective_io_concurrency=200'
      - '-c'
      - 'bgwriter_delay=50ms'
      - '-c'
      - 'bgwriter_lru_maxpages=200'
      - '-c'
      - 'shared_buffers=1GB'
      - '-c'
      - 'work_mem=32MB'
      - '-c'
      - 'maintenance_work_mem=256MB'
      - '-c'
      - 'effective_cache_size=3GB'
      - '-c'
      - 'default_statistics_target=100'
      - '-c'
      - 'checkpoint_timeout=15min'
      - '-c'
      - 'checkpoint_completion_target=0.9'

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: no
    profiles:
      - metrics
    environment:
      DATA_SOURCE_URI: postgres:5432/dcssstats?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    command:
      - '--collector.stat_checkpointer'
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.5
    restart: no
    stop_grace_period: 1m
    command:
      - '--config.file=/etc/prometheus/prometheus.local.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--config.auto-reload'
    profiles:
      - metrics
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-local-storage:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - node_exporter
      - postgres_exporter

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: no
    profiles:
      - metrics
    container_name: node_exporter

  grafana:
    image: grafana/grafana-enterprise:13.3.0
    container_name: grafana
    restart: no
    profiles:
      - metrics
    environment:
      GF_SERVER_HTTP_PORT: 3333
      GF_PLUGINS_DISABLE_PLUGINS: >-
        grafana-assistant-app,
        grafana-exploretraces-app,
        grafana-lokiexplore-app,
        grafana-metricsdrilldown-app,
        grafana-pyroscope-app
    ports:
      - '3333:3333'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres18-local-volume:
  prometheus-local-storage:
  grafana-storage:
  monster-catalog-storage:
